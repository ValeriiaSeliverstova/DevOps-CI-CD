controller:
  serviceType: ClusterIP
  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - credentials-binding
    - configuration-as-code
    - job-dsl
    - github
  installLatestPlugins: true
  numExecutors: 0
  executorMode: NORMAL
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "768Mi"
  persistence:
    enabled: false
  JCasC:
    defaultConfig: true

persistence:
  enabled: false

agent:
  enabled: true
  alwaysPullImage: true
  idleMinutes: 5
  podName: "jenkins-agent"

rbac:
  create: true

serviceAccount:
  create: true
